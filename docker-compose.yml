services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      TRUST_PROXY: "1"
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_BACKEND: bullmq
      RUN_BACKGROUND_WORKERS: "false"
      PRODUCT_VECTOR_SEARCH_ENABLED: "true"
      RAG_GEMINI_QUERY_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 45s

  worker:
    build:
      context: ./backend
    command: ["node", "worker.js"]
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_BACKEND: bullmq
      PRODUCT_VECTOR_SEARCH_ENABLED: "true"
      RAG_GEMINI_QUERY_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 90s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data:
